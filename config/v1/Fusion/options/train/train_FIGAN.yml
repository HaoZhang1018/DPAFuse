#### general settings
name: FIGAN
use_tb_logger: true
model: FIGAN
distortion: mixed
gpu_ids: [0,1]
  
#### datasets
datasets:
  train:
    name: Train_Dataset
    mode: AutoXY
    dataroot_X: ./datasets/train/X
    dataroot_Y: ./datasets/train/Y

    use_shuffle: true
    n_workers: 8  # per GPU
    batch_size: 32
    X_size: 384
    Y_size: 384
    use_flip: true
    use_rot: true
    use_swap: false
    color: RGB
  val:
    name: Val_Dataset
    mode: AutoXY
    dataroot_X: ./datasets/test/X
    dataroot_Y: ./datasets/test/Y


#### network structures
network_RE:
  which_model: RENet
  setting:
    img_channel: 8
    width: 64
    enc_blk_nums: [1, 1, 1, 28]
    middle_blk_num: 1
    dec_blk_nums: [1, 1, 1, 1]


network_AE:
  which_model: UNet
  setting:
    in_ch: 3
    out_ch: 3
    ch: 8
    ch_mult: [4, 8, 8, 16]
    embed_dim: 8

network_Fusion:
  which_model: FusionNet
  setting:
    in_channels: 16
    model_channels: 64
    out_channels: 8

network_D_fea:
  which_model: Discriminator_Fea
  setting:
    input_channel: 8
    num_filters_last: 64
    n_layers: 3


network_D_img:
  which_model: Discriminator_Img
  setting:
    input_channel: 3
    num_filters_last: 64
    n_layers: 3



#### path
path:
  pretrain_model_RE_X: pretrained_models/RE_VIS.pth
  pretrain_model_RE_Y: pretrained_models/RE_IR.pth
  pretrain_model_Fusion: ~
  strict_load: true
  resume_state: 
  pretrain_model_AE: pretrained_models/AutoEncoder.pth

#### training settings: learning rate scheme, loss
train:
  optimizer: Lion
  lr_G: !!float 3e-5
  lr_scheme: TrueCosineAnnealingLR
  beta1: 0.9
  beta2: 0.99
  #niter: 400000
  niter: 10000000
  warmup_iter: -1  # no warm up
  lr_steps: [200000, 400000, 600000]
  lr_gamma: 0.5
  eta_min: !!float 1e-7

  # criterion
  is_weighted: False
  loss_type: l1
  weight: 1.0

  manual_seed: 0
  val_freq: !!float 50

#### logger
logger:
  print_freq: 50
  save_checkpoint_freq: !!float 50
