#### general settings
name: RobustEncoder
use_tb_logger: true
model: RENet
distortion: mixed
gpu_ids: [0,1]

#### datasets
datasets:
  train:
    name: Train_Dataset
    mode: AutoLQGT
    dataroot_GT: ./datasets/train/GT
    dataroot_LQ: ./datasets/train/LQ

    use_shuffle: true
    n_workers: 8  # per GPU
    batch_size: 4
    GT_size: 384
    LR_size: 384
    use_flip: true
    use_rot: true
    use_swap: false
    color: RGB
  val:
    name: Val_Dataset
    mode: AutoLQGT
    dataroot_GT: ./datasets/test/GT
    dataroot_LQ: ./datasets/test/LQ


#### network structures
network_RE:
  which_model: RENet
  setting:
    img_channel: 8
    width: 64
    enc_blk_nums: [1, 1, 1, 28]
    middle_blk_num: 1
    dec_blk_nums: [1, 1, 1, 1]

network_AE:
  which_model: UNet
  setting:
    in_ch: 3
    out_ch: 3
    ch: 8
    ch_mult: [4, 8, 8, 16]
    embed_dim: 8

#### path
path:
  pretrain_model_RE: ~
  strict_load: true
  resume_state: ~
  pretrain_model_AE: pretrained_models/AutoEncoder.pth

#### training settings: learning rate scheme, loss
train:
  optimizer: Lion
  lr_G: !!float 1e-6
  lr_scheme: TrueCosineAnnealingLR
  beta1: 0.9
  beta2: 0.99
  #niter: 400000
  niter: 10000000
  warmup_iter: -1  # no warm up
  lr_steps: [200000, 400000, 600000]
  lr_gamma: 0.5
  eta_min: !!float 1e-7

  # criterion
  is_weighted: False
  loss_type: l1
  weight: 1.0

  manual_seed: 0
  val_freq: !!float 1000

#### logger
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 1000
